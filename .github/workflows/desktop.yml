name: desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RESOURCES: apps/desktop/src-tauri/resources
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - name: Bundle the server
        run: vp pack
        working-directory: apps/server
      - name: Copy the server and the Node runtime
        run: |
          New-Item -ItemType Directory -Force "$env:RESOURCES/runtime", "$env:RESOURCES/server" | Out-Null
          Copy-Item (node -p "process.execPath") "$env:RESOURCES/runtime/node.exe"
          Copy-Item apps/server/dist/*.mjs "$env:RESOURCES/server/"
          $versions = @{}
          foreach ($name in '@huggingface/transformers', 'sqlite-vec') {
            $versions[$name] = (Get-Content "apps/server/node_modules/$name/package.json" | ConvertFrom-Json).version
          }
          @{ name = 'aredoko-server'; private = $true; type = 'module'; dependencies = $versions } |
            ConvertTo-Json | Set-Content "$env:RESOURCES/server/package.json"
          "nodeLinker: hoisted", "allowBuilds:", "  onnxruntime-node: false", "  protobufjs: false" |
            Set-Content "$env:RESOURCES/server/pnpm-workspace.yaml"
      - name: Install the native dependencies of the server
        run: vp install --prod --no-frozen-lockfile
        working-directory: apps/desktop/src-tauri/resources/server
      - name: Drop the onnxruntime binaries for other platforms
        run: |
          Get-ChildItem "$env:RESOURCES/server/node_modules/onnxruntime-node/bin" -Recurse -Directory |
            Where-Object { $_.Name -in 'linux', 'darwin' } | Remove-Item -Recurse -Force
      - name: Download the embedding model
        run: vp run fetch-model --model-dir "${{ github.workspace }}/${{ env.RESOURCES }}/models"
        working-directory: apps/server
      - name: Build the installer
        run: vp exec tauri build --config src-tauri/tauri.release.conf.json
        working-directory: apps/desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aredoko-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$env:TAG" (Get-Item apps/desktop/src-tauri/target/release/bundle/nsis/*.exe) --clobber --repo "$env:GITHUB_REPOSITORY"

  ci-telemetry:
    needs: [installer]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: masseater/typescript-template/.github/actions/ci-telemetry@95e2f74d3c06b74eeb25e7188be85e0750964549
        with:
          github-token: ${{ github.token }}
