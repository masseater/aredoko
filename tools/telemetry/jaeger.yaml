service:
  extensions: [jaeger_storage, jaeger_query]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]

extensions:
  jaeger_query:
    storage:
      traces: memory
    ai:
      mcp: {}

  jaeger_storage:
    backends:
      memory:
        memory:
          max_traces: 100000

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: localhost:4317
      http:
        endpoint: localhost:4318
        cors:
          allowed_origins:
            - http://localhost:1420

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: memory
